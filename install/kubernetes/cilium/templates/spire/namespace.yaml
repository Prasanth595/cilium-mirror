{{- if and .Values.authentication.mutual.spire.enabled .Values.authentication.mutual.spire.install.enabled (not .Values.authentication.mutual.spire.install.existingNamespace) -}}
{{- $annotations := .Values.authentication.mutual.spire.annotations -}}
{{- if include "cilium.spire.upstreamSecret" . -}}
{{- $annotations = set (deepCopy ($annotations | default dict)) "helm.sh/resource-policy" "keep" -}}
{{- end -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.authentication.mutual.spire.install.namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
